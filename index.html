<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <meta name="color-scheme" content="light">
  <title>个人记录 · 留一刻给自己</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="calendar.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <div class="header-brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 3v4m10-4v4M4 10h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="m9 15 2 2 4-4"/></svg></div>
        <h1>个人记录<span class="title-dot">.</span></h1>
      </div>
      <p class="subtitle">简单记录，不必多想。</p>
    </header>

    <p id="storage-error" class="error-banner" role="alert" hidden></p>

    <section class="calendar-card" aria-label="打卡日历">
      <div class="calendar-toolbar">
        <div class="month-heading"><h2 id="month-title" aria-live="polite"></h2><p id="month-subtitle" lang="en"></p></div>
        <div class="calendar-controls">
          <button id="previous-month" class="icon-button" type="button" aria-label="上个月"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg></button>
          <button id="go-today" class="today-button" type="button">今天</button>
          <button id="next-month" class="icon-button" type="button" aria-label="下个月"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 7 5 5-5 5"/></svg></button>
        </div>
      </div>
      <div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div id="calendar-days" class="calendar-days" role="group" aria-labelledby="month-title"></div>
      <div class="calendar-legend"><span class="legend-dot"></span>有记录的一天<span class="legend-today">描边为今天</span></div>
    </section>

    <section class="checkin-section" aria-label="记录当前时间">
      <button id="checkin" class="checkin-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 4 4 8-8"/></svg><span id="checkin-label">打卡 · 记录当前时间</span></button>
      <p class="checkin-hint">记录此刻，不论你正在查看哪一天</p>
    </section>

    <section class="records-section" aria-labelledby="records-title">
      <div class="records-heading"><h2 id="records-title"></h2><span id="record-count" class="record-count"></span></div>
      <div id="empty-state" class="empty-state">
        <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></div>
        <p>这天还没有记录</p><span>每一次记录，都只属于你。</span>
      </div>
      <ul id="records-list" class="records-list"></ul>
    </section>

    <footer><div class="privacy-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="10" width="12" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v2"/></svg>只在这里，只属于你</div><p>记录仅保存在当前浏览器，清除浏览器数据后会丢失。</p></footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
    <h2 id="delete-title">删除这条记录？</h2>
    <p id="delete-description"></p>
    <div class="dialog-actions"><button id="cancel-delete" class="secondary-button" type="button" autofocus>保留记录</button><button id="confirm-delete" class="danger-button" type="button">确认删除</button></div>
  </dialog>
  <noscript><p class="noscript">请启用 JavaScript 后使用日历和打卡功能。</p></noscript>
</body>
</html>
